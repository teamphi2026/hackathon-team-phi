# Render blueprint for the FastAPI backend (Vercel serves only the static pages).
# The app keeps sessions/login tokens in memory and writes leave requests to the
# CSV files, so it must run as ONE long-lived process (1 worker, 1 instance).
# Note: Render's disk is ephemeral, so CSV changes reset on redeploy/restart (fine for a demo).
services:
  - type: web
    name: leave-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Secrets: enter these in the Render dashboard (never commit them).
      - key: ICA_API_KEY
        sync: false
      - key: ICA_BASE_URL
        sync: false
      - key: ICA_MODEL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # Render's free tier blocks outbound SMTP on ports 25, 465 and 587.
      # Brevo also accepts STARTTLS on 2525, which is not blocked.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Public URL of this service, used for the Approve/Reject links in emails,
      # e.g. https://leave-agent-api.onrender.com
      - key: APP_BASE_URL
        sync: false
      # Leave forecast Google Sheet (see backend/leave_forecast.py).
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
