# Render blueprint for the FastAPI backend (Vercel serves only the static pages).
# Run ONE worker and ONE instance: writes and session identity are serialized.
# Configure google_sheets after following docs/google-sheets-storage.md.
# CSV mode is local/demo only; Render's filesystem is ephemeral.
services:
  - type: web
    name: leave-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATA_BACKEND
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        value: 1ItLM27vcTfpyeuZBQeuhFTvz86ERTqpSG4zpOOapysk
      # Add google-service-account.json under Render > Secret Files.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-service-account.json
      - key: PYTHON_VERSION
        value: 3.11.9
      # Secrets: enter these in the Render dashboard (never commit them).
      - key: ICA_API_KEY
        sync: false
      - key: ICA_BASE_URL
        sync: false
      - key: ICA_MODEL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      # Render's free tier blocks outbound SMTP on ports 25, 465 and 587.
      # Brevo also accepts STARTTLS on 2525, which is not blocked.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Public URL of this service, used for the Approve/Reject links in emails,
      # e.g. https://leave-agent-api.onrender.com
      - key: APP_BASE_URL
        sync: false
