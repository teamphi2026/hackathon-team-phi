<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hello World</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #ffffff;
            background: #080b12;
            overflow: hidden;
        }

        /* Ambient background */
        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite alternate;
        }

        body::before {
            background: #6c63ff;
            top: -200px;
            left: -150px;
        }

        body::after {
            background: #00d4ff;
            right: -200px;
            bottom: -200px;
            animation-delay: -4s;
        }

        /* Main card */
        .card {
            position: relative;
            z-index: 1;

            width: min(90%, 720px);
            padding: 80px 60px;

            text-align: center;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .badge {
            display: inline-block;
            margin-bottom: 24px;
            padding: 8px 14px;

            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            color: #a5f3fc;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 999px;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.06em;

            background: linear-gradient(
                135deg,
                #ffffff 20%,
                #a5f3fc 50%,
                #818cf8 80%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            margin-top: 24px;

            font-size: 1.1rem;
            line-height: 1.7;
            color: #94a3b8;
        }

        .button {
            display: inline-block;
            margin-top: 36px;
            padding: 14px 24px;

            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            font-size: 14px;
            font-weight: 600;
            text-decoration: none;

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .footer {
            margin-top: 40px;

            font-size: 12px;
            color: #475569;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(40px, 30px) scale(1.1);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 60px 25px;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <span class="badge">IBM Hackathon 2026</span>

        <h1>Team Phi 2026</h1>

    </main>

</body>
</html>
